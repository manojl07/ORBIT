<svg width="512" height="512" viewBox="0 0 512 512" fill="none"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title desc">
  <title id="title">ORBIT logo mark</title>
  <desc id="desc">Three interlocking orbital loops forming the ORBIT symbol.</desc>

  <defs>
    <linearGradient id="orbitGradient" x1="95" y1="100" x2="420" y2="412"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B2CBF"/>
      <stop offset="0.48" stop-color="#B044D0"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>

    <filter id="orbitGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.48
                0 1 0 0 0.17
                0 0 1 0 0.75
                0 0 0 0.75 0"/>
    </filter>
  </defs>

  <!-- Soft glow layer. Kept separate so it can be removed for small/icon use. -->
  <g opacity="0.55" filter="url(#orbitGlow)">
    <ellipse cx="256" cy="256" rx="190" ry="82"
             transform="rotate(0 256 256)"
             stroke="url(#orbitGradient)" stroke-width="15"/>
    <ellipse cx="256" cy="256" rx="190" ry="82"
             transform="rotate(60 256 256)"
             stroke="url(#orbitGradient)" stroke-width="15"/>
    <ellipse cx="256" cy="256" rx="190" ry="82"
             transform="rotate(120 256 256)"
             stroke="url(#orbitGradient)" stroke-width="15"/>
  </g>

  <!--
    Core orbital paths.
    IMPORTANT:
    Each orbit is its own SVG element. This is intentional:
    GSAP can animate strokeDasharray/strokeDashoffset on each path
    independently for the future ORBIT glimmer effect.
  -->
  <g id="orbit-core"
     stroke="url(#orbitGradient)"
     stroke-width="8"
     stroke-linecap="round"
     stroke-linejoin="round">

    <ellipse id="orbit-0"
             cx="256" cy="256" rx="190" ry="82"
             transform="rotate(0 256 256)"/>

    <ellipse id="orbit-1"
             cx="256" cy="256" rx="190" ry="82"
             transform="rotate(60 256 256)"/>

    <ellipse id="orbit-2"
             cx="256" cy="256" rx="190" ry="82"
             transform="rotate(120 256 256)"/>
  </g>
</svg>
